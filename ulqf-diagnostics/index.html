<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>ULQF diagnostics</title><style>body{font:16px system-ui;max-width:42rem;margin:4rem auto;padding:1rem}button{font:inherit;padding:.75rem 1rem}</style></head><body><h1>ULQF collector diagnostic</h1><p>Submit one synthetic test event. No production traffic is counted. The next page displays the collector's JSON reply. Use a private browsing window if multiple Google accounts cause errors.</p><form method="post" enctype="text/plain" action="https://script.google.com/macros/s/AKfycbzqXmGU6W-T6EdSLY2v1xeDOF90eJQnypcb5MnSOfBj8M6J0vb-urukZ7NUjy_Q_UbRvQ/exec" id="test"><input type="hidden" id="payload" name="" value=""><button type="submit">Send one test event</button></form><p id="status" role="status"></p><script>document.getElementById("test").addEventListener("submit",function(e){try{const id=crypto.randomUUID();const f=document.getElementById("payload");f.name=JSON.stringify({id,alias:"ulqf-canary",ref:"",device:"unknown"}).slice(0,-1)+',"padding":"';f.value='"}';document.getElementById("status").textContent="Submitting "+id;}catch(err){e.preventDefault();document.getElementById("status").textContent="Cannot generate test identifier: "+err.message;}});</script></body></html>
